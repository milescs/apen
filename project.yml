name: Apen
options:
  bundleIdPrefix: com.milescs
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release
  AppStore: release
  AppStoreDebug: debug

packages:
  ApenKit:
    path: Packages/ApenKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
  MenuBarExtraAccess:
    url: https://github.com/orchetect/MenuBarExtraAccess
    from: 1.3.1

targets:
  Apen:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
      AppStore: Config/AppStore.xcconfig
      AppStoreDebug: Config/AppStoreDebug.xcconfig
    sources:
      - path: App
        excludes:
          - "**/*.entitlements"
          - "Helper/**"
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Apen
        CFBundleDisplayName: Apen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSMicrophoneUsageDescription: Apen records your voice while you dictate and transcribes it on this Mac. Audio never leaves your computer.
        NSHumanReadableCopyright: Local dictation with open-weight models.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.milescs.apen
            CFBundleURLSchemes: [apen]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio or Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.movie]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - package: ApenKit
        product: ApenCore
      - package: ApenKit
        product: ApenEngines
      - package: KeyboardShortcuts
      - package: MenuBarExtraAccess
      - target: ApenLLMHelper
        embed: true
        codeSign: true
        copy:
          destination: executables

  ApenLLMHelper:
    type: tool
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
      AppStore: Config/AppStore.xcconfig
      AppStoreDebug: Config/AppStoreDebug.xcconfig
    sources:
      - path: App/Helper
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: apen-llm
        PRODUCT_BUNDLE_IDENTIFIER: com.milescs.apen.llm-helper
        CODE_SIGN_ENTITLEMENTS: App/Helper/Helper.entitlements
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SKIP_INSTALL: YES
      configs:
        AppStore:
          CODE_SIGN_ENTITLEMENTS: App/Helper/Helper-AppStore.entitlements
        AppStoreDebug:
          CODE_SIGN_ENTITLEMENTS: App/Helper/Helper-AppStore.entitlements
    dependencies:
      - package: ApenKit
        product: ApenLLM

schemes:
  Apen:
    build:
      targets:
        Apen: all
    run:
      config: Debug
    archive:
      config: Release
