name: Apen
options:
  bundleIdPrefix: com.milescs
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  ApenKit:
    path: Packages/ApenKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
  MenuBarExtraAccess:
    url: https://github.com/orchetect/MenuBarExtraAccess
    from: 1.3.1

targets:
  Apen:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App
        excludes:
          - "**/*.entitlements"
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Apen
        CFBundleDisplayName: Apen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSMicrophoneUsageDescription: Apen records your voice while you dictate and transcribes it on this Mac. Audio never leaves your computer.
        NSHumanReadableCopyright: Local dictation with open-weight models.
        CFBundleURLTypes:
          - CFBundleURLName: com.milescs.apen
            CFBundleURLSchemes: [apen]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio or Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.movie]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - package: ApenKit
        product: ApenCore
      - package: ApenKit
        product: ApenEngines
      - package: KeyboardShortcuts
      - package: MenuBarExtraAccess

schemes:
  Apen:
    build:
      targets:
        Apen: all
    run:
      config: Debug
    archive:
      config: Release
